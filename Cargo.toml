[workspace]
members = ["rstorch-derive", "fixtures"]

[workspace.package]
version = "0.3.0"
authors = ["Ferran Sanchez Llado"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferranSanchezLlado/rstorch.git"
edition = "2024"
rust-version = "1.88"

[package]
name = "rstorch"
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/rstorch"
description = "A safer PyTorch-inspired deep learning library: one tensor type, linear gradients"
keywords = ["neural-network", "machine-learning", "deep-learning", "pytorch", "tensor"]
categories = ["science", "mathematics", "algorithms"]
edition.workspace = true
rust-version.workspace = true

[dependencies]
half = "2"
rayon = { version = "1", optional = true }
rstorch-derive = { version = "0.3.0", path = "rstorch-derive" }
safetensors = "0.8"
# The safetensors header is JSON; `serde_json` parses it (and already builds,
# as a `safetensors` dependency) instead of a hand-rolled scanner here.
serde = "1"
serde_json = "1"
thiserror = "2"
flate2 = { version = "1", optional = true }
ureq = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"
# Reads the committed PyTorch reference vectors in `tests/numerics.rs`, in
# place of a bespoke parser inside the test file.
serde_json = "1"
trybuild = "1"

[[bench]]
name = "tensor_ops"
harness = false

[[bench]]
name = "training"
harness = false

[[bench]]
name = "data_pipeline"
harness = false

# Typed-vs-dynamic wrapper overhead. Gated on the feature it measures, so the
# default bench build is unchanged.
[[bench]]
name = "typed_overhead"
harness = false
required-features = ["typed"]

# Big-model (ResNet/MNIST) backend throughput. One sample is a whole training
# step, so it is gated behind its own feature and never joins a plain
# `cargo bench`.
[[bench]]
name = "resnet_mnist"
harness = false
required-features = ["bench-resnet"]

[features]
default = []
typed = []
hub = ["dep:flate2", "dep:ureq"]
rayon = ["dep:rayon"]
# Enables the `resnet_mnist` bench target only — no library code depends on it.
# It exists so a minutes-long big-model benchmark cannot be picked up by a plain
# `cargo bench`.
bench-resnet = []
# Experimental until the conformance + perf gate passes.
metal = ["dep:metal"]
