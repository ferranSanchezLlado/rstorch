[workspace]
members = ["rstorch-derive", "fixtures"]

[workspace.package]
version = "0.3.0"
authors = ["Ferran Sanchez Llado"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferranSanchezLlado/rstorch.git"
edition = "2024"
rust-version = "1.88"

[package]
name = "rstorch"
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/rstorch"
description = "A safer PyTorch-inspired deep learning library: one tensor type, linear gradients"
keywords = ["neural-network", "machine-learning", "deep-learning", "pytorch", "tensor"]
categories = ["science", "mathematics", "algorithms"]
edition.workspace = true
rust-version.workspace = true

# Dependency policy (docs/restart-v3/exploration.md §3.1 "dependencies over
# dogma"): this manifest is integrator-owned after T00; tasks other than
# bench/fixture owners must not edit it. The full expected dependency set is
# declared up front.
[dependencies]
half = "2"
rayon = { version = "1", optional = true }
rstorch-derive = { version = "0.3.0", path = "rstorch-derive" }
safetensors = "0.8"
thiserror = "2"
flate2 = { version = "1", optional = true }
ureq = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"
# Reads the committed PyTorch reference vectors in `tests/numerics.rs` (T31).
# Already in the lock file via `trybuild`; sanctioned by the integrator in
# place of a bespoke parser inside the test file.
serde_json = "1"
trybuild = "1"

# Bench targets are owned by the bench tasks
# (docs/restart-v3/implementation-plan.md §1.3, §3 grid): T28 owns
# `tensor_ops`; T47 adds `training` and `data_pipeline`.
[[bench]]
name = "tensor_ops"
harness = false

[features]
default = []
hub = ["dep:flate2", "dep:ureq"]
rayon = ["dep:rayon"]
# Experimental until the T61 conformance + perf gate passes
# (docs/restart-v3/implementation-plan.md §4 Wave 6).
metal = ["dep:metal"]
