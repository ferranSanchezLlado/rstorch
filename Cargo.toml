[workspace]
members = ["rstorch-derive", "fixtures"]

[workspace.package]
version = "1.0.0"
authors = ["Ferran Sanchez Llado"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferranSanchezLlado/rstorch.git"
edition = "2024"
rust-version = "1.88"

[package]
name = "rstorch"
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/rstorch"
description = "A safer PyTorch-inspired deep learning library: one tensor type, linear gradients"
keywords = ["neural-network", "machine-learning", "deep-learning", "pytorch", "tensor"]
categories = ["science", "mathematics", "algorithms"]
edition.workspace = true
rust-version.workspace = true
# The design record (`docs/`) is untracked working material; `test-tools/` and
# `api/` are the CI gate's harness and its 3.5 MB of recorded surfaces, which
# no consumer of the crate reads. `tests/` and `benches/` stay in: they are
# declared targets, so the manifest a consumer resolves must still find their
# sources.
exclude = [".github/", "api/", "test-tools/", ".gitignore"]

# docs.rs renders the whole surface, not just the default features, so `typed`,
# `hub`, `rayon`, `metal`, and `wgpu` are documented. `metal` compiles only on macOS, so
# that target is built as well as the default Linux one.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[dependencies]
half = "2"
rayon = { version = "1", optional = true }
rstorch-derive = { version = "1.0.0", path = "rstorch-derive" }
safetensors = "0.8"
# The safetensors header is JSON; `serde_json` parses it (and already builds,
# as a `safetensors` dependency) instead of a hand-rolled scanner here.
serde = "1"
serde_json = "1"
thiserror = "2"
flate2 = { version = "1", optional = true }
ureq = { version = "2", optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "26", optional = true, default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc = { version = "0.19.9", optional = true, default-features = false, features = ["driver", "nvrtc", "f16", "cuda-13030", "dynamic-loading", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["std", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLTypes"] }

[dev-dependencies]
criterion = "0.8.2"
# Reads the committed PyTorch reference vectors in `tests/numerics.rs`, in
# place of a bespoke parser inside the test file.
serde_json = "1"
trybuild = "1"

[[bench]]
name = "tensor_ops"
harness = false

[[bench]]
name = "training"
harness = false

[[bench]]
name = "metal_ops"
harness = false
required-features = ["metal"]

[[bench]]
name = "wgpu_ops"
harness = false
required-features = ["wgpu"]

[[bench]]
name = "cuda_ops"
harness = false
required-features = ["cuda"]

[[bench]]
name = "data_pipeline"
harness = false

# Typed-vs-dynamic wrapper overhead. Gated on the feature it measures, so the
# default bench build is unchanged.
[[bench]]
name = "typed_overhead"
harness = false
required-features = ["typed"]

# Big-model (ResNet/MNIST) backend throughput. One sample is a whole training
# step, so it is gated behind its own feature and never joins a plain
# `cargo bench`.
[[bench]]
name = "resnet_mnist"
harness = false
required-features = ["bench-resnet"]

# The typed example names typed types, so a default `cargo build --examples`
# must skip it rather than fail to compile.
[[example]]
name = "typed"
required-features = ["typed"]

[[example]]
name = "mnist"
required-features = ["hub"]

[[example]]
name = "tiny_shakespeare"
required-features = ["hub"]

[[example]]
name = "typed_mnist"
required-features = ["typed", "hub"]

# The two integration suites that drive `rstorch::testing::check_grad`, which
# the `testing` feature gates. Declaring the requirement here means a plain
# `cargo test` skips them instead of failing to compile; the CI lanes that own
# their coverage pass `--features testing`.
[[test]]
name = "numerics"
required-features = ["testing"]

[[test]]
name = "reduced_precision"
required-features = ["testing"]

[features]
default = ["metal"]
typed = []
hub = ["dep:flate2", "dep:ureq"]
rayon = ["dep:rayon"]
# Enables the `resnet_mnist` bench target only — no library code depends on it.
# It exists so a minutes-long big-model benchmark cannot be picked up by a plain
# `cargo bench`.
bench-resnet = []
# Conformance-tested GPU acceleration on macOS. On other targets this default
# feature has no platform dependency; `Device::best_available` considers a
# hardware WGPU adapter before falling back to CPU when WGPU is enabled.
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
# Portable native GPU compute through WebGPU. Kept opt-in because it adds a
# substantial graphics dependency. F16 is negotiated per adapter at runtime.
wgpu = ["dep:pollster", "dep:wgpu"]
# NVIDIA CUDA acceleration on Linux and Windows.
cuda = ["dep:cudarc"]
# The finite-difference gradient harness (`rstorch::testing`). It is a test
# utility, not frozen library surface, so it is the one public module outside
# the semver guarantee in STABILITY.md — hence a feature rather than an
# unconditional `pub mod`.
testing = []
