[package]
name = "rstorch"
version = "0.2.0"
authors = ["Ferran Sanchez Llado"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ferranSanchezLlado/rstorch.git"
homepage = "https://github.com/ferranSanchezLlado/rstorch.git"
documentation = "https://docs.rs/rstorch"
description = "Implementation from scratch of a neural network framework in Rust inspired by PyTorch"
keywords = ["neural-network", "machine-learning", "deep-learning", "pytorch", "rust"]
categories = ["science", "mathematics", "algorithms"]
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000", "f16"], optional = true }
flate2 = { version = "1", optional = true }
half = "2"
pollster = { version = "0.4", optional = true }
ureq = { version = "2", optional = true }
wgpu = { version = "25", optional = true }

[dev-dependencies]
criterion = "0.8.2"
trybuild = "1"

[[bench]]
name = "tensor_ops"
harness = false

[[bench]]
name = "training"
harness = false

[[bench]]
name = "data_pipeline"
harness = false

[features]
# The GPU backend features are experimental: native kernels cover only
# constructors, same-shape/scalar arithmetic, matmul, and sum; every other
# tensor op runs as reference code through host round trips, and none of them
# is a supported training path. CUDA has never been hardware-verified. See
# docs/backend-dtype-support.md for the audited matrix and the 1.0 backend
# claims decision.
metal = ["dep:metal"]
wgpu = ["dep:pollster", "dep:wgpu"]
cuda = ["dep:cudarc"]
hub = ["dep:flate2", "dep:ureq"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }
