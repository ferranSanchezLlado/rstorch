# restart-v3 CI (implementation-plan §1.2): stable + MSRV, fmt, clippy
# -D warnings, doc build, and a cargo-public-api diff against the committed
# baseline. Branch filters keep pushed task branches from triggering this;
# only integration branches and PRs targeting them run.
name: CI

on:
  push:
    branches: [restart-v3, compile-time]
  pull_request:
    branches: [restart-v3, compile-time]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.88 is the MSRV; lints/fmt run on stable only so lint drift
        # between toolchains cannot wedge CI.
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check
      # On Ubuntu, --all-features checks the Linux cfg surface only; it does
      # not exercise the macOS-only Metal backend or Metal hardware.
      - name: Clippy (all features)
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Compile benchmarks
        if: matrix.toolchain == 'stable'
        run: cargo bench --workspace --no-run
      - name: Docs (all features)
        if: matrix.toolchain == 'stable'
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: Linux features (hub, rayon; no Metal hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # Metal is macOS-only. This lane tests the portable optional features
      # and must not be interpreted as a Metal runtime or hardware test.
      - name: Test hub and rayon
        run: cargo test --workspace --features hub,rayon

  surfaces:
    name: Surface (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            feature_args: ""
          - name: typed
            feature_args: --features typed
          - name: all features
            feature_args: --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace ${{ matrix.feature_args }}
      - name: Test
        run: cargo test --workspace ${{ matrix.feature_args }}
      - name: Docs
        run: cargo doc --workspace --no-deps ${{ matrix.feature_args }}
        env:
          RUSTDOCFLAGS: -D warnings

  ui:
    name: UI (Rust 1.88 pinned)
    runs-on: ubuntu-latest
    env:
      RSTORCH_UI: "1"
      # Nested cargo commands in typed_ui must use the fixture-pinned compiler.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test all UI suites (all features)
        run: cargo test --workspace --all-features
      - name: Test typed check and build diagnostics
        run: cargo test --test typed_ui --features typed
      - name: Test Grads linearity diagnostics
        run: cargo test --test linearity_ui
      - name: Test derive diagnostics
        run: cargo test -p rstorch-derive --test ui

  ui-stable:
    name: Typed UI semantic fragments (stable)
    runs-on: ubuntu-latest
    env:
      RSTORCH_UI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test typed diagnostic semantics
        run: cargo test --test typed_ui --features typed

  public-api:
    name: Public API diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly-2026-06-15 --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Diff dynamic and typed surfaces
        run: |
          test "$(shasum -a 256 src/prelude.rs | cut -d ' ' -f 1)" = d51c608f4a8e8f83e78572374b70c401f12b37c532c22056139b7847b9abcbea
          cargo +nightly-2026-06-15 public-api -p rstorch --simplified --no-default-features > /tmp/dynamic-default.txt
          diff -u docs/restart-v3/public-api-baseline.txt /tmp/dynamic-default.txt
          diff -u docs/restart-v3/ct00-baselines/public-api-dynamic-default.txt /tmp/dynamic-default.txt
          cargo +nightly-2026-06-15 public-api -p rstorch --simplified --no-default-features --features hub,rayon > /tmp/dynamic-portable.txt
          diff -u docs/restart-v3/ct00-baselines/public-api-dynamic-portable.txt /tmp/dynamic-portable.txt
          cargo +nightly-2026-06-15 public-api -p rstorch --simplified --no-default-features --features typed > /tmp/typed.txt
          diff -u docs/restart-v3/ct41-ct48-baselines/public-api-typed.txt /tmp/typed.txt
          cargo +nightly-2026-06-15 public-api -p rstorch --simplified --no-default-features --features typed,hub,rayon > /tmp/typed-portable.txt
          diff -u docs/restart-v3/ct41-ct48-baselines/public-api-typed-portable.txt /tmp/typed-portable.txt

  metal-training-macos:
    name: Metal training execution (macOS runner)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # This executes Metal on the current hosted macOS runner. Hosted runner
      # hardware is not guaranteed, so this is execution evidence, not a
      # persistent hardware-availability claim.
      - name: Test Metal training
        run: cargo +stable test --features metal --test metal_training

  public-api-macos:
    name: Public API diff (macOS all features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly-2026-06-15 --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Diff macOS all-feature surfaces
        run: |
          cargo +nightly-2026-06-15 public-api -p rstorch --simplified --no-default-features --features hub,rayon,metal > /tmp/dynamic-macos.txt
          diff -u docs/restart-v3/ct00-baselines/public-api-dynamic-macos-all-runtime.txt /tmp/dynamic-macos.txt
          cargo +nightly-2026-06-15 public-api -p rstorch --simplified --all-features > /tmp/typed-macos.txt
          diff -u docs/restart-v3/ct41-ct48-baselines/public-api-typed-macos-all-features.txt /tmp/typed-macos.txt

  ct20-macos-boundary:
    name: CT20 wrong-device boundary (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test hardware-independent wrong-device rejection
        run: cargo +1.88 test --features typed,metal --lib wrong_runtime_device_is_rejected_without_metal_storage
