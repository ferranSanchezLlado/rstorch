[package]
name = "rstorch-derive"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive macros for rstorch (#[derive(Module)])"
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# The dev-dependency cycle (rstorch depends on rstorch-derive) is deliberate:
# the derive's own tests need the real `nn` contracts to expand against, and
# `trybuild` drives the pinned-toolchain UI suite (see `tests/`).
[dev-dependencies]
rstorch = { path = ".." }
trybuild = "1"
