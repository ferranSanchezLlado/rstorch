# Crate owned by T13 (docs/restart-v3/implementation-plan.md §3): T13 adds
# its own dependencies (syn/quote) and the derive implementation.
[package]
name = "rstorch-derive"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive macros for rstorch (#[derive(Module)])"
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Dev-dependency cycle (rstorch depends on rstorch-derive) is sanctioned by
# the T13 brief: the derive's own tests need the frozen `nn` contracts, and
# `trybuild` drives the pinned-toolchain UI suite (see `tests/`).
[dev-dependencies]
rstorch = { path = ".." }
trybuild = "1"
